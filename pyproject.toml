[project]
name = "text-to-sql-agent"
version = "0.1.0"
description = "Interactive text-to-SQL CLI agent: schema-aware prompt, read-only guard, error-fed repair loop, result-set eval harness. Works with any OpenAI-compatible LLM."
requires-python = ">=3.11"
dependencies = ["openai>=1.40", "pandas>=2.0", "python-dotenv>=1.0"]

[project.scripts]
cli = "src.cli:main"
setup-db = "src.setup_db:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]
